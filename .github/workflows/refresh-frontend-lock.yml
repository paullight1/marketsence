name: Refresh Frontend Lockfile

on:
  push:
    branches:
      - review/marketsence-hardening-20260821
    paths:
      - .github/refresh-lockfile-trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: review/marketsence-hardening-20260821
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate secure production dependency tree
        working-directory: frontend
        run: |
          npm install next@16.3.1 --save-exact
          npm uninstall shadcn recharts
          npm audit fix --package-lock-only --omit=dev
      - name: Show production audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh secure frontend dependency lock"
            git push origin HEAD:review/marketsence-hardening-20260821
          fi
